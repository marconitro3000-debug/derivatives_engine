[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "derivatives-engine"
version = "1.0.0"
description = "Derivatives pricing & volatility calibration engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Marco"}
]
keywords = ["quantitative finance", "derivatives pricing", "options", "forwards", "futures", "volatility", "heston", "black-scholes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "core*",
    "options*",
    "forwards*",
    "futures*",
    "rates*",
    "credit*",
    "volatility*",
    "exotics*",
    "structured*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
