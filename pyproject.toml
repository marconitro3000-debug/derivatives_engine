[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "derivatives-engine"
version = "1.0.0"
description = "Modular derivatives pricing engine with a visual structured-products workbench"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Marco"}
]
keywords = ["quantitative finance", "derivatives pricing", "structured products", "phoenix autocall", "fastapi", "market data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "requests>=2.31",
    "yfinance>=0.2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.26",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "core*",
    "options*",
    "forwards*",
    "futures*",
    "rates*",
    "credit*",
    "volatility*",
    "exotics*",
    "structured*",
    "api*",
    "data*",
    "db*",
    "arbitrage*",
    "ml*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
